<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Gatebound Support{% endblock %}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14151a;
    --panel: #1c1e26;
    --border: #2c2f3a;
    --text: #e8e9ee;
    --muted: #9599a8;
    --accent: #7c8cff;
    --accent-text: #0c0d10;
    --danger: #ff8b8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: 3rem 1.25rem;
  }
  main {
    width: 100%;
    max-width: 40rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  p { color: var(--muted); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
  .field .value { font-size: 1rem; }
  select, textarea, input[type=text] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { min-height: 6rem; resize: vertical; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.2rem;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .status-badge {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.15rem 0.7rem;
    font-size: 0.85rem;
  }
  footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <h1>{% block heading %}Gatebound Support{% endblock %}</h1>
  {% block content %}{% endblock %}
  <footer>Gatebound Support</footer>
</main>
</body>
</html>
