[project]
name = "gatebound_support"
version = "0.1.0"
description = "Gatebound support service: MCP tools + ticket flow + kb-sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    # Deliberately NOT the [voice] extra: it pulls in `davey`, which makes discord.py
    # negotiate DAVE end-to-end encryption; sending then works but discord-ext-voice-recv
    # cannot decrypt DAVE frames, so every received packet fails Opus decoding
    # ("corrupted stream"). PyNaCl below is the only voice dependency we want.
    "discord-py>=2.7",
    "discord-ext-voice-recv>=0.5.2a179",
    "pynacl>=1.5.0",
    "elevenlabs>=2.68.0",
    "numpy>=2.4.6",
]

[project.scripts]
gatebound-support = "gatebound_support.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatebound_support"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "respx>=0.21",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
